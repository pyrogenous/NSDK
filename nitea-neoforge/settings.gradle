pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'nitea-neoforge'

// Builds the library from the sibling folder, so changes are picked up without publishing
includeBuild('../nitea-java')

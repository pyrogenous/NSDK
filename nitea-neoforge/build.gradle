plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = project.nitea_version
group = 'cc.nitea'

base {
    archivesName = 'nitea-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java {
    withSourcesJar()
}

// Only used to compile against Minecraft and NeoForge: this jar is a library, not a mod
neoForge {
    version = project.neo_version
}

dependencies {
    // The loader-independent core. Mods bundle both jars with Jar-in-Jar (see README)
    api "cc.nitea:nitea-java:${project.nitea_version}"
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Automatic-Module-Name': 'cc.nitea.neoforge',
                // A game library: loaded next to Minecraft so it can use its classes, but not a mod (no mod list
                // entry, no neoforge.mods.toml). The core starts it from Nitea.init.
                'FMLModType': 'GAMELIBRARY',
                'Implementation-Title': 'Nitea for NeoForge',
                'Implementation-Version': project.version,
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'nitea-neoforge'
            from components.java
            pom {
                name = 'Nitea for NeoForge'
                description = 'NeoForge integration of Nitea: the in-game consent screen and title screen button'
                url = 'https://nitea.cc'
            }
        }
    }
}

// The files offered as "Download NSDK for NeoForge" on the website: this jar and the core it needs
tasks.register('nsdk', Copy) {
    from tasks.named('jar')
    from(configurations.runtimeClasspath) {
        include 'nitea-java-*.jar'
    }
    into layout.buildDirectory.dir('nsdk')
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

ext.niteaLoader = 'fabric'
ext.niteaMinecraft = '26.2'
apply from: '../../../gradle/nitea-module.gradle'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// On Fabric, Nitea is a library mod (fabric.mod.json, no entry point): Fabric only loads nested jars that are mods.
// Mod Menu shows it under libraries. Nitea.init starts its screens.
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    compileOnly 'net.fabricmc:fabric-loader:0.19.5'
}

tasks.named('processResources', ProcessResources) {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

// The loader-independent core of Nitea. It is not published on its own: every artifact in versions/ compiles these
// sources in. It targets Java 8 so the same code runs from Minecraft 1.8.9 to the latest release.
plugins {
    id 'java-library'
}

// The newest JDK Minecraft uses: the compatibility tests load old Nitea releases, some of which were built for it
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def rootProps = new Properties()
file('../gradle.properties').withInputStream { rootProps.load(it) }
def niteaVersion = System.getenv('NITEA_VERSION') ?: rootProps.getProperty('nitea_version')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The library itself must run on Java 8; the tests only run here, on a modern JDK
tasks.named('compileJava', JavaCompile) {
    options.release = 8
    options.compilerArgs << '-Xlint:-options'
}
tasks.named('compileTestJava', JavaCompile) {
    options.release = 17
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'nitea.version', niteaVersion
    // ./gradlew -p core test -PupdateApi rewrites src/test/resources/api/<line>.txt from the current public API
    if (project.hasProperty('updateApi')) systemProperty 'nitea.updateApi', 'true'
    systemProperty 'nitea.testResources', file('src/test/resources').absolutePath
}

// The core as it ships in this release, kept by the compatibility tests to check that later releases still work
// with mods built against it and share their state with it: ./gradlew -p core compatFixture (see AGENTS.md)
tasks.register('compatFixture', Jar) {
    group = 'verification'
    from sourceSets.main.output
    archiveFileName = "nitea-core-${niteaVersion}.jar"
    destinationDirectory = file('src/test/resources/compat')
    manifest {
        attributes('Implementation-Title': 'Nitea', 'Implementation-Version': niteaVersion)
    }
}

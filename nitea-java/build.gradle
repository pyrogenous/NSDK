plugins {
    id 'java-library'
    id 'maven-publish'
}

// On JitPack, publish under the coordinates it serves (com.github.<user>.<repo>:nitea-java:<tag>)
group = System.getenv('JITPACK') ? "${System.getenv('GROUP')}.${System.getenv('ARTIFACT')}" : 'cc.nitea'
version = System.getenv('JITPACK') ? System.getenv('VERSION') : '0.2.0'

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // The library itself has no dependencies, so it can be embedded in any mod without conflicts
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    // Java 17 bytecode and APIs, so one jar runs on every NeoForge release: Minecraft 1.20.1 (Java 17) up to 26.x (Java 25)
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('javadoc', Javadoc) {
    exclude 'cc/nitea/internal/**'
    options.addBooleanOption('Xdoclint:none', true)
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Automatic-Module-Name': 'cc.nitea',
                // Tells (Neo)Forge to load the jar as a plain library when a mod embeds it with Jar-in-Jar
                'FMLModType': 'LIBRARY',
                'Implementation-Title': 'Nitea',
                'Implementation-Version': project.version,
        )
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'nitea-java'
            from components.java
            pom {
                name = 'Nitea'
                description = 'Error reporting and player feedback for Minecraft mods (Fabric, NeoForge, Forge)'
                url = 'https://nitea.cc'
            }
        }
    }
}

pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Builds Nitea from the sibling folders, so library changes are picked up without publishing.
// A real mod would instead depend on the published artifacts from Maven.
includeBuild('../nitea-java')
includeBuild('../nitea-neoforge')

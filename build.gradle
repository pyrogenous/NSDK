// Runs a task in the core and in every versions/<minecraft>/<loader>/ build:
//   ./gradlew buildAll              compile and test everything
//   ./gradlew publishAll            write every artifact to build/repo (the Maven repository CI publishes)
//   ./gradlew publishToMavenLocal   install every artifact in ~/.m2 (what JitPack serves)
def versionBuilds = gradle.includedBuilds.findAll { it.name != 'core' }

tasks.register('buildAll') {
    group = 'build'
    dependsOn gradle.includedBuild('core').task(':build')
    versionBuilds.each { dependsOn it.task(':build') }
}

tasks.register('publishAll') {
    group = 'publishing'
    dependsOn gradle.includedBuild('core').task(':test')
    versionBuilds.each { dependsOn it.task(':publishMavenJavaPublicationToNiteaRepository') }
}

tasks.register('publishToMavenLocal') {
    group = 'publishing'
    dependsOn gradle.includedBuild('core').task(':test')
    versionBuilds.each { dependsOn it.task(':publishMavenJavaPublicationToMavenLocal') }
}
